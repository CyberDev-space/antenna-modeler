    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      // The theme before the first paint, so that a dark page never flashes white:
      // the one of the address, the one chosen before, else that of the system.
      (function () {
        var given = new URLSearchParams(location.search).get("theme");
        var stored = null;
        try {
          stored = localStorage.getItem("antenna-modeler.theme");
        } catch (error) {}
        var theme = given === "light" || given === "dark" ? given : stored === "light" || stored === "dark" ? stored : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
